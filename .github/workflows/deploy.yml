name: Deploy Laravel Portfolio

# Run this workflow whenever you push to main
on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # Pull code from GitHub
      - uses: actions/checkout@v7

      # Set up Node and build Vite assets
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: Install NPM packages
        run: npm ci

      - name: Build assets
        run: npm run build

      # Deploy the Laravel application to the domain root.
      - name: Deploy Laravel application
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.HOSTINGER_HOST }}
          username: ${{ secrets.HOSTINGER_USER }}
          password: ${{ secrets.HOSTINGER_PASS }}
          protocol: ftp
          port: 21
          local-dir: ./
          exclude: |
            vendor/**
            node_modules/**
            .git/**
            .github/**
            tests/**
          server-dir: ../

      # Install Composer dependencies on Hostinger
      - name: Install Composer dependencies on server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HOSTINGER_SSH_HOST }}
          username: ${{ secrets.HOSTINGER_SSH_USER }}
          password: ${{ secrets.HOSTINGER_SSH_PASSWORD }}
          port: ${{ secrets.HOSTINGER_SSH_PORT }}
          script: |
            set -e
            cd ~/domains/a-mamal.com
            composer2 install --no-dev --optimize-autoloader
            php artisan optimize:clear
            php artisan optimize

      # Configure public_html symlink
      # Hostinger uses public_html as the document root.
      # This exposes only Laravel's public directory while keeping application files outside the web root.
      - name: Configure public_html symlink
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HOSTINGER_SSH_HOST }}
          username: ${{ secrets.HOSTINGER_SSH_USER }}
          password: ${{ secrets.HOSTINGER_SSH_PASSWORD }}
          port: ${{ secrets.HOSTINGER_SSH_PORT }}
          script: |
            set -e
            cd ~/domains/a-mamal.com
            rm -rf ./public_html
            ln -s ./public public_html